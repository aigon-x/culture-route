<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CultureRoute — a timed cultural route</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2305070a%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22none%22 stroke=%22%234c82d9%22 stroke-width=%223%22/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05070a; --panel:#12161c; --panel-2:#1a1f27; --text:#e9ecf0; --muted:#8b95a3;
    --accent:#4c82d9; --ok:#5de1e6; --warn:#f0b429; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  body{min-height:100vh;background:
    radial-gradient(1200px 600px at 20% -10%,rgba(76,130,217,.18),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(93,225,230,.08),transparent 55%),var(--bg)}
  .wrap{max-width:960px;margin:0 auto;padding:48px 20px 72px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:clamp(24px,3vw,34px);letter-spacing:-.02em;margin:0}
  h1 span{color:var(--accent)}
  .mode{font:12px/1 "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--muted);
    border:1px solid #222a35;border-radius:999px;padding:8px 12px}
  .lede{color:var(--muted);max-width:56ch;margin:8px 0 28px}
  form{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:12px;align-items:end;
    background:var(--panel);border:1px solid #1d242e;border-radius:var(--radius);padding:16px}
  label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);
    letter-spacing:.04em;text-transform:uppercase}
  input,select{background:var(--panel-2);border:1px solid #26303d;color:var(--text);
    border-radius:8px;padding:11px 12px;font-size:15px}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);
    outline-offset:2px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;
    font-weight:600;cursor:pointer;transition:transform 180ms ease,filter 120ms ease}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.55;cursor:progress}
  .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:24px}
  .card{background:var(--panel);border:1px solid #1d242e;border-radius:14px;padding:18px 20px}
  .card h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  ol.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .stop{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:12px 0;
    border-bottom:1px solid #171e27}
  .stop:last-child{border-bottom:0}
  .time{font:13px/1.4 "JetBrains Mono",monospace;color:var(--ok)}
  .kind{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);border:1px solid rgba(76,130,217,.35);border-radius:999px;
    padding:2px 8px;margin-right:8px}
  .name{font-weight:600}
  .why{color:var(--muted);font-size:14px;margin-top:4px}
  .meta{color:var(--muted);font-size:13px}
  .trace{font:12px/1.6 "JetBrains Mono",monospace;color:var(--muted);white-space:pre-wrap;
    max-height:320px;overflow:auto}
  .state{border:1px dashed #2a3441;border-radius:12px;padding:18px;color:var(--muted)}
  .state.error{border-color:rgba(240,180,41,.5);color:var(--warn)}
  .empty{display:none}
  @media (max-width:820px){
    form{grid-template-columns:1fr 1fr}
    .grid{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    wrap{padding-top:32px}
    form{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Culture<span>Route</span></h1>
    <div class="mode" id="mode">OFFLINE FIXTURES</div>
  </header>
  <p class="lede">A taste-aware agent that turns “what should I do tonight?” into a timed route:
  each stop is chosen for your profile and the mood, and every choice carries its reason.</p>

  <form id="plan-form" aria-label="Plan a cultural route">
    <label>City<input id="city" name="city" value="Berlin" autocomplete="address-level2"></label>
    <label>Mood
      <select id="mood" name="mood">
        <option value="curious">curious</option>
        <option value="reflective">reflective</option>
        <option value="energetic">energetic</option>
      </select>
    </label>
    <label>Minutes<input id="minutes" name="minutes" type="number" min="30" max="600" step="15" value="180"></label>
    <button id="submit" type="submit">Plan the evening</button>
  </form>

  <p class="state empty" id="empty" role="status" aria-live="polite" hidden></p>
  <p class="state error" id="error" role="alert" aria-live="assertive" hidden></p>

  <div class="grid">
    <section class="card" aria-labelledby="route-title">
      <h2 id="route-title">Route</h2>
      <p class="meta" id="summary" aria-live="polite"></p>
      <ol class="timeline" id="timeline"></ol>
    </section>
    <section class="card" aria-labelledby="trace-title">
      <h2 id="trace-title">Decision trace</h2>
      <div class="trace" id="trace">Run a plan to see every step.</div>
    </section>
  </div>
</div>

<script>
const START_MINUTES = 19 * 60;
const fmt = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

function setState(kind, message) {
  const empty = document.getElementById("empty");
  const error = document.getElementById("error");
  empty.hidden = kind !== "empty";
  error.hidden = kind !== "error";
  empty.textContent = kind === "empty" ? message : "";
  error.textContent = kind === "error" ? message : "";
}

function render(route) {
  const timeline = document.getElementById("timeline");
  const trace = document.getElementById("trace");
  timeline.innerHTML = "";
  let clock = START_MINUTES;
  route.items.forEach((item) => {
    const li = document.createElement("li");
    li.className = "stop";
    const end = clock + item.minutes;
    li.innerHTML = `
      <div class="time">${fmt(clock)}<br><span class="meta">${item.minutes} min</span></div>
      <div><span class="kind">${item.kind}</span><span class="name"></span>
        <div class="why"></div></div>`;
    li.querySelector(".name").textContent = item.name;
    li.querySelector(".why").textContent = item.why;
    timeline.appendChild(li);
    clock = end;
  });
  document.getElementById("summary").textContent =
    `${route.items.length} stops, ${fmt(START_MINUTES)}–${fmt(clock)} · ${route.city} · ${route.mood}`;
  trace.textContent = route.trace.map((step) =>
    `${String(step.step).padStart(2, "0")} ${step.kind || "-"} ${step.decision || ""} ${step.name || ""} ${step.score ?? ""} ${step.reason || step.error || ""}`.trim()
  ).join("\n");
  setState(route.items.length ? "none" : "empty",
           route.items.length ? "" : "The agent found no stop that fits the profile and the time budget.");
}

document.getElementById("plan-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("submit");
  button.disabled = true;
  setState("none", "");
  try {
    const response = await fetch("/api/plan", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        city: document.getElementById("city").value.trim() || "Berlin",
        mood: document.getElementById("mood").value,
        minutes: Number(document.getElementById("minutes").value) || 180,
      }),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const route = await response.json();
    document.getElementById("mode").textContent = route.mode || "OFFLINE FIXTURES";
    render(route);
  } catch (err) {
    setState("error", `The plan could not be built: ${err.message}. Try again or switch the city.`);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
